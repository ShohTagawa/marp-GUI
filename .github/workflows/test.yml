name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: node --test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (root)
        run: npm ci --no-audit --no-fund
      - name: Install (preview extension)
        run: npm ci --no-audit --no-fund
        working-directory: tools/marp-scroll-sync
      - name: Lint the sample decks
        run: npm run lint -- slides
      - name: Run tests (Chrome-driven tests run when Chrome is found on the runner, otherwise they skip)
        run: npm test
        env:
          CI: "1"
